<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<style>
:root{--deep:#04111e;--deep2:#071828;--ocean:#0369a1;--sky:#0ea5e9;--cyan:#06b6d4;--aqua:#22d3ee;--foam:#bae6fd;--line:rgba(14,165,233,.18);--muted:rgba(186,230,253,.6);--card:rgba(7,24,40,.94)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Noto Sans KR',sans-serif;color:#fff;background:var(--deep)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(4,17,30,.96);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}
.topbar h1{font-family:'Black Han Sans',sans-serif;font-size:19px;font-weight:400}
.topbar h1 em{color:var(--aqua);font-style:normal}
.tabs{display:flex;gap:6px;padding:12px 16px}
.tab{flex:1;padding:11px 0;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.65);font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
.tab.on{border-color:var(--sky);background:rgba(14,165,233,.18);color:#fff}
.tab b{color:var(--aqua);margin-left:4px}
#map{height:38vh;min-height:220px;margin:0 16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a1b2e}
.map-note{font-size:11px;color:var(--muted);margin:6px 18px 0;line-height:1.6}
.list{padding:14px 16px 60px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer}
.card.sel{border-color:rgba(34,211,238,.55);background:rgba(14,165,233,.07)}
.c-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.c-who{font-size:12px;color:var(--muted)}
.c-when{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4)}
.f{margin-bottom:9px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:11px;background:rgba(255,255,255,.05);color:#fff;padding:0 12px;font-family:inherit;font-size:14px;outline:none}
.f select option{color:#000}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.memo{font-size:13px;color:#e0f2fe;background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.2);border-radius:11px;padding:10px 12px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.near{font-size:12px;color:#fde68a;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:11px;padding:9px 12px;margin-bottom:10px;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;min-height:46px;border-radius:13px;border:none;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
.ok{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.no{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.35)!important}
.acts button:disabled{opacity:.5}
.reject-box{display:none;margin-top:8px;gap:8px}
.reject-box.open{display:flex}
.reject-box input{flex:1;height:44px;border:1.5px solid rgba(239,68,68,.4);border-radius:11px;background:rgba(255,255,255,.05);color:#fff;padding:0 12px;font-family:inherit;font-size:13px;outline:none}
.reject-box button{padding:0 16px;border-radius:11px;border:none;background:#ef4444;color:#fff;font-family:inherit;font-weight:900;cursor:pointer}
.state{font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px}
.state.approved{background:rgba(16,185,129,.15);color:#34d399}
.state.rejected{background:rgba(239,68,68,.12);color:#f87171}
.msg{text-align:center;padding:60px 24px;color:var(--muted);line-height:1.9;font-size:14px}
.msg a{display:inline-block;margin-top:16px;padding:13px 26px;border-radius:14px;background:linear-gradient(135deg,var(--sky),var(--aqua));color:#fff;text-decoration:none;font-weight:900}
.tabs{flex-wrap:wrap}
.tab{min-width:calc(50% - 3px)}
.search{display:flex;gap:8px;padding:0 16px 12px}
.search input{flex:1;height:46px;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;padding:0 14px;font-family:inherit;font-size:14px;outline:none}
.search button{padding:0 18px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--sky),var(--aqua));color:#fff;font-family:inherit;font-weight:900;cursor:pointer}
.diff{border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;margin-bottom:10px}
.diff label{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:13px;cursor:pointer}
.diff label+label{border-top:1px solid rgba(255,255,255,.06)}
.diff input{width:18px;height:18px;accent-color:#22d3ee;flex-shrink:0}
.diff .k{color:var(--muted);min-width:64px}
.diff .from{color:rgba(255,255,255,.5);text-decoration:line-through}
.diff .to{color:#34d399;font-weight:900}
.diff .warn{color:#fca5a5;font-weight:900}
.c-name{font-size:15px;font-weight:900}
.state.closed,.state.dismissed{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.state.applied{background:rgba(16,185,129,.15);color:#34d399}
.f select.f-fac{height:40px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips label{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
.tchips input{width:16px;height:16px;accent-color:#22d3ee}
.tchips label:has(input:checked){border-color:var(--sky);background:rgba(14,165,233,.2)}
.photo-box{margin-bottom:10px}
.photo-box img{max-width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.1);display:block}
.photo-box button,.mini{padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.visit{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;background:rgba(16,185,129,.14);color:#34d399;margin-left:6px}
.blocked{color:#f87171;font-weight:900}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:rgba(16,185,129,.95);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.warn{background:rgba(239,68,68,.95)}
</style>
</head>
<body>
<div class="topbar">
  <a href="mypage.html">←</a>
  <h1>운영자 · 세차장 <em>관리</em></h1>
</div>
<div id="app"><div class="msg">확인 중…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ppx.js"></script>
<script>
const typeLabel={self:'셀프세차',hand:'손세차',detail:'디테일링샵',notouch:'노터치',auto:'자동세차',wash:'종류 확인 중',etc:'정비·기타'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'pending', items = [], approved = [], selId = null;
let map = null, reqMarker = null, nearMarkers = [];
let searchTerm = '';
const FIELDS = PPX.FIELDS || [], PAY = PPX.PAY || {}, SVC = PPX.SVC || {}, VISIT = PPX.VISIT || {};
const fieldVal = PPX.fieldVal || ((p, f) => p[f.k] ?? null);
const facText = v => v === true ? '있음' : v === false ? '없음' : '모름';
// info 안 값 글로
function infoText(k, v) {
  if(v === null || v === undefined || v === '') return '모름';
  if(k === 'pay') return (v || []).map(x => PAY[x] || x).join(' · ') || '없음';
  if(k === 'svc') return (v || []).map(x => SVC[x] || x).join(' · ') || '없음';
  if(k === 'bays') return v + '칸';
  if(k === 'pw') return Number(v).toLocaleString() + '원';
  if(k === 'pm') return v + '분';
  if(typeof v === 'boolean') return facText(v);
  return String(v);
}
const INFO_LABEL = { pay:'결제', svc:'서비스', bays:'세차 칸', pw:'기본 요금', pm:'기본 시간', height:'높이 제한' };
FIELDS.forEach(f => { INFO_LABEL[f.k] = f.l; });
// 제보한 사람: 닉네임, 없으면 가입 안 한 기기 번호 앞자리
const whoOf = (prof, uid) => prof && prof.nickname ? esc(prof.nickname) : `가입 안 한 기기 #${esc(String(uid || '').slice(0, 6) || '?')}`;
const typesOf = p => (p && p.types && p.types.length) ? p.types : (p ? [p.type] : []);
const typesText = ts => (ts || []).map(t => typeLabel[t] || t).join(' · ');
// 대표 종류(지도 아이콘) + 함께 있는 종류(체크) 입력칸
function typeFields(it) {
  const has = typesOf(it);
  return `
    <div class="f"><label>대표 종류 (지도 아이콘)</label><select data-k="type">${Object.keys(typeLabel).map(t => `<option value="${t}" ${t===it.type?'selected':''}>${typeLabel[t]}</option>`).join('')}</select></div>
    <div class="f"><label>함께 있는 종류 (여러 개)</label><div class="tchips">${Object.keys(typeLabel).map(t =>
      `<label><input type="checkbox" data-type="${t}" ${has.includes(t)?'checked':''}>${typeLabel[t]}</label>`).join('')}</div></div>`;
}

function toast(msg, warn) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function ago(iso) {
  if(!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${Math.max(m,1)}분 전` : m < 1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`;
}
function distM(a, b) {
  const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function gate(html) { document.getElementById('app').innerHTML = `<div class="msg">${html}</div>`; }

async function init() {
  if(!PPX.ready) return gate('Supabase 연결 정보가 아직 없어요.<br>js/config.js 를 확인해 주세요.');
  let me = null;
  try { me = await PPX.me(); } catch(e) {}
  if(!me) return gate('운영자 계정으로 로그인해 주세요.<br><a href="login.html?next=admin.html">💧 로그인</a>');
  if(me.role !== 'admin') return gate('운영자만 볼 수 있는 화면이에요.<br><a href="map.html">지도로 돌아가기</a>');

  document.getElementById('app').innerHTML = `
    <div class="tabs">
      <button class="tab on" data-t="pending" type="button">추가 요청<b id="pendingN"></b></button>
      <button class="tab" data-t="reports" type="button">정보 제보<b id="reportsN"></b></button>
      <button class="tab" data-t="edit" type="button">세차장 고치기</button>
      <button class="tab" data-t="done" type="button">처리 내역</button>
    </div>
    <div id="searchBox"></div>
    <div id="map"></div>
    <div class="map-note" id="mapNote"></div>
    <div class="list" id="list"></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    tab = b.dataset.t;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===b));
    load();
  });
  if(window.naver && naver.maps && !window.__naverAuthFailed) {
    map = new naver.maps.Map('map', { center: new naver.maps.LatLng(37.5, 126.9), zoom: 15, zoomControl: true, mapDataControl: false });
  } else {
    document.getElementById('map').innerHTML = '<div class="msg" style="padding:40px 10px">지도를 불러올 수 없어요</div>';
  }
  try { approved = await PPX.approvedPlaces(); } catch(e) { approved = []; }
  refreshCounts();
  load();
}

async function refreshCounts() {
  try {
    const [a, b] = await Promise.all([PPX.adminList('pending'), PPX.adminReports('pending')]);
    document.getElementById('pendingN').textContent = a.length ? ' ' + a.length : '';
    document.getElementById('reportsN').textContent = b.length ? ' ' + b.length : '';
  } catch(e) {}
}

// 각 항목의 지도 위치 (제보는 해당 세차장 위치)
const locOf = it => it.place ? it.place : it;

async function load() {
  const note = {
    pending: '📍 빨간 핀 = 요청 위치 · 파란 점 = 근처에 이미 등록된 세차장 (중복 확인용)',
    reports: '📍 빨간 핀 = 제보된 세차장 · 파란 점 = 근처 세차장',
    edit: '📍 빨간 핀 = 고치는 세차장 · 파란 점 = 근처 세차장',
    done: '📍 처리한 항목의 위치'
  }[tab];
  document.getElementById('mapNote').textContent = note;
  document.getElementById('searchBox').innerHTML = tab === 'edit' ? `
    <form class="search" id="searchForm">
      <input id="searchInput" placeholder="세차장 이름, 주소, 지역 (예: 컴인워시, 남동구)" value="${esc(searchTerm)}" maxlength="40">
      <button type="submit">검색</button>
    </form>` : '';
  if(tab === 'edit') {
    document.getElementById('searchForm').onsubmit = e => {
      e.preventDefault(); searchTerm = document.getElementById('searchInput').value.trim(); load();
    };
  }
  const list = document.getElementById('list');
  list.innerHTML = '<div class="msg">불러오는 중…</div>';
  try {
    if(tab === 'pending') items = await PPX.adminList('pending');
    else if(tab === 'reports') items = await PPX.adminReports('pending');
    else if(tab === 'edit') items = searchTerm ? await PPX.adminSearch(searchTerm) : [];
    else {
      const [a, b] = await Promise.all([PPX.adminList('done'), PPX.adminReports('done')]);
      items = [...a.map(x => ({...x, kind:'req'})), ...b.map(x => ({...x, kind:'rep', id:'r'+x.id}))]
        .sort((x, y) => String(y.reviewed_at||'').localeCompare(String(x.reviewed_at||''))).slice(0, 60);
    }
  } catch(e) {
    list.innerHTML = `<div class="msg">목록을 불러오지 못했어요<br>${esc(PPX.koError(e))}</div>`;
    return;
  }
  if(tab === 'pending') document.getElementById('pendingN').textContent = items.length ? ' ' + items.length : '';
  if(tab === 'reports') document.getElementById('reportsN').textContent = items.length ? ' ' + items.length : '';
  selId = items[0] ? items[0].id : null;
  render();
  showOnMap();
}

function nearbyOf(loc, selfId) {
  return approved.filter(p => p.id !== selfId).map(p => ({p, d: distM(loc, p)})).filter(x => x.d < 300).sort((a,b) => a.d-b.d);
}

function facSelect(k, v, where) {
  return `<select class="f-fac" ${where === 'info' ? 'data-info-fac' : 'data-fac'}="${k}">
    <option value="null" ${v==null?'selected':''}>모름</option>
    <option value="true" ${v===true?'selected':''}>있음</option>
    <option value="false" ${v===false?'selected':''}>없음</option></select>`;
}

function cardPending(it) {
  const near = nearbyOf(it, it.id).slice(0, 3);
  const who = whoOf(it.submitter, it.submitted_by);
  return `
    <div class="card ${it.id===selId?'sel':''}" data-id="${it.id}">
      <div class="c-top"><span class="c-who">요청: <b style="color:#fff">${who}</b>${it.submitter && it.submitter.blocked ? ' <span class="blocked">(막힘)</span>' : ''}</span><span class="c-when">${ago(it.created_at)}</span></div>
      ${it.memo ? `<div class="memo">💬 ${esc(it.memo)}</div>` : ''}
      ${near.length ? `<div class="near">⚠️ 300m 안에 등록된 세차장이 있어요. 중복인지 확인하세요.<br>${near.map(x => `· ${esc(x.p.name)} (${Math.round(x.d)}m)`).join('<br>')}</div>` : ''}
      <div class="f"><label>세차장 이름</label><input data-k="name" value="${esc(it.name)}" maxlength="60"></div>
      ${typeFields(it)}
      <div class="f"><label>지역</label><input data-k="region" value="${esc(it.region)}" placeholder="예: 인천 남동구" maxlength="30"></div>
      <div class="f"><label>주소</label><input data-k="addr" value="${esc(it.addr)}" maxlength="200"></div>
      <div class="f"><label>전화번호</label><input data-k="tel" value="${esc(it.tel||'')}" maxlength="30"></div>
      <div class="acts">
        <button class="no" type="button" data-act="reject">반려</button>
        <button class="ok" type="button" data-act="approve">✅ 승인 → 지도에 등록</button>
      </div>
      <div class="reject-box"><input placeholder="반려 사유 (요청자에게 보여요)" maxlength="200"><button type="button" data-act="reject-send">반려하기</button></div>
    </div>`;
}

function cardReport(it) {
  const p = it.place;
  const who = whoOf(it.reporter_p, it.reporter);
  if(!p) return `<div class="card" data-id="${it.id}"><div class="c-who">세차장이 삭제됐어요</div>
    <div class="acts"><button class="no" type="button" data-act="dismiss">목록에서 지우기</button></div></div>`;
  const sg = it.suggest || {};
  const rows = [];
  const row = (key, label, from, to, attr) => rows.push(`<label><input type="checkbox" ${attr || `data-s="${key}"`} checked><span class="k">${esc(label)}</span><span class="from">${esc(from)}</span>→<span class="to">${esc(to)}</span></label>`);
  if(Array.isArray(sg.types) && sg.types.length) row('types', '종류', typesText(typesOf(p)), typesText(sg.types.filter(t => typeLabel[t])));
  else if('type' in sg && typeLabel[sg.type]) row('type', '종류', typesText(typesOf(p)), typeLabel[sg.type]);
  FIELDS.filter(f => f.col).forEach(f => { if(f.k in sg) row(f.k, f.l, facText(p[f.k] ?? null), facText(sg[f.k])); });
  [['hours','운영시간'],['tel','전화'],['price','요금']].forEach(([k, l]) => { if(k in sg) row(k, l, p[k] || '없음', sg[k]); });
  Object.entries(sg.info || {}).forEach(([k, v]) => {
    if(!(k in INFO_LABEL)) return;
    row(null, INFO_LABEL[k], infoText(k, (p.info || {})[k]), infoText(k, v), `data-info="${esc(k)}"`);
  });
  if(sg.closed) rows.push(`<label><input type="checkbox" data-s="closed" checked><span class="k">상태</span><span class="warn">폐업·세차장 아님 → 지도에서 숨김</span></label>`);
  const blocked = it.reporter_p && it.reporter_p.blocked;
  return `
    <div class="card ${it.id===selId?'sel':''}" data-id="${it.id}">
      <div class="c-top"><span class="c-name">${esc(p.name)}</span><span class="c-when">${ago(it.created_at)}</span></div>
      <div class="c-who" style="margin-bottom:10px">${esc(p.addr || p.region || '')} · 제보: <b style="color:#fff">${who}</b>${blocked ? ' <span class="blocked">(막힘)</span>' : ''}${it.visit ? `<span class="visit">${esc(VISIT[it.visit] || it.visit)}</span>` : ''}${p.status==='closed' ? ' · <span class="state closed">이미 숨김</span>' : ''}</div>
      ${rows.length ? `<div class="diff">${rows.join('')}</div>` : ''}
      ${it.memo ? `<div class="memo">💬 ${esc(it.memo)}</div>` : ''}
      ${it.photo ? `<div class="photo-box" data-photo="${esc(it.photo)}"><button type="button" data-act="photo">📷 가격표 사진 보기</button></div>` : ''}
      <div class="acts">
        <button class="no" type="button" data-act="dismiss">무시</button>
        <button class="ok" type="button" data-act="apply">${rows.length ? '✅ 체크한 내용 반영' : '✅ 확인함'}</button>
      </div>
      ${it.reporter ? `<div style="text-align:right;margin-top:8px"><button class="mini" type="button" data-act="${blocked ? 'unblock' : 'block'}">${blocked ? '이 사람 제보 다시 받기' : '🚫 장난 제보면: 이 사람 제보 막기'}</button></div>` : ''}
    </div>`;
}

function cardEdit(it) {
  if(it.id !== selId) return `
    <div class="card" data-id="${it.id}">
      <div class="c-top"><span class="c-name">${esc(it.name)}</span>${it.status==='closed' ? '<span class="state closed" style="margin-left:auto">숨김</span>' : it.status==='unlocated' ? '<span class="state closed" style="margin-left:auto">위치 확인 필요</span>' : ''}</div>
      <div class="c-who">${esc(typesText(typesOf(it)))} · ${esc(it.addr || it.region || '')}</div>
    </div>`;
  return `
    <div class="card sel" data-id="${it.id}">
      <div class="f"><label>세차장 이름</label><input data-k="name" value="${esc(it.name)}" maxlength="60"></div>
      ${typeFields(it)}
      <div class="f"><label>지역</label><input data-k="region" value="${esc(it.region)}" maxlength="30"></div>
      <div class="f"><label>주소</label><input data-k="addr" value="${esc(it.addr)}" maxlength="200"></div>
      <div class="f-row">
        <div class="f"><label>전화번호</label><input data-k="tel" value="${esc(it.tel||'')}" maxlength="30"></div>
        <div class="f"><label>운영시간</label><input data-k="hours" value="${esc(it.hours||'')}" placeholder="예: 06:00~23:00" maxlength="60"></div>
      </div>
      <div class="f-row">${FIELDS.map(f => `<div class="f"><label>${esc(f.l)}</label>${facSelect(f.k, fieldVal(it, f), f.col ? '' : 'info')}</div>`).join('')}</div>
      <div class="f-row">
        <div class="f"><label>세차 칸 수</label><input data-info-in="bays" value="${esc((it.info||{}).bays ?? '')}" inputmode="numeric" maxlength="2"></div>
        <div class="f"><label>기본 요금(원)</label><input data-info-in="pw" value="${esc((it.info||{}).pw ?? '')}" inputmode="numeric" maxlength="6"></div>
        <div class="f"><label>기본 시간(분)</label><input data-info-in="pm" value="${esc((it.info||{}).pm ?? '')}" inputmode="numeric" maxlength="3"></div>
        <div class="f"><label>높이 제한</label><input data-info-in="height" value="${esc((it.info||{}).height ?? '')}" maxlength="10"></div>
      </div>
      <div class="f"><label>요금 (자유롭게)</label><input data-k="price" value="${esc(it.price||'')}" maxlength="200"></div>
      <div class="f"><label>결제 방법</label><div class="tchips">${Object.entries(PAY).map(([k,l]) => `<label><input type="checkbox" data-info-multi="pay" data-v="${k}" ${((it.info||{}).pay||[]).includes(k)?'checked':''}>${esc(l)}</label>`).join('')}</div></div>
      <div class="f"><label>서비스 (손세차·디테일링)</label><div class="tchips">${Object.entries(SVC).map(([k,l]) => `<label><input type="checkbox" data-info-multi="svc" data-v="${k}" ${((it.info||{}).svc||[]).includes(k)?'checked':''}>${esc(l)}</label>`).join('')}</div></div>
      <div class="f"><label>지도 표시</label><select data-k="status">
        <option value="approved" ${it.status==='approved'?'selected':''}>지도에 표시</option>
        <option value="closed" ${it.status==='closed'?'selected':''}>숨김 (폐업·세차장 아님)</option>
        <option value="unlocated" ${it.status==='unlocated'?'selected':''}>위치 확인 필요 (좌표 오류로 숨김)</option></select></div>
      <div class="acts"><button class="ok" type="button" data-act="save">💾 저장</button></div>
    </div>`;
}

function cardDone(it) {
  if(it.kind === 'rep') {
    const p = it.place;
    return `
      <div class="card ${it.id===selId?'sel':''}" data-id="${it.id}">
        <div class="c-top"><span class="state ${it.status}">${it.status==='applied'?'제보 반영':'제보 무시'}</span>
          <b>${esc(p ? p.name : '(삭제된 세차장)')}</b><span class="c-when">${ago(it.reviewed_at)}</span></div>
        <div class="c-who">제보: ${whoOf(it.reporter_p, it.reporter)}${it.memo ? ' · ' + esc(it.memo) : ''}</div>
      </div>`;
  }
  const who = whoOf(it.submitter, it.submitted_by);
  return `
    <div class="card ${it.id===selId?'sel':''}" data-id="${it.id}">
      <div class="c-top"><span class="state ${it.status}">${it.status==='approved'?'승인':'반려'}</span>
        <b>${esc(it.name)}</b><span class="c-when">${ago(it.reviewed_at)}</span></div>
      <div class="c-who">${esc(typesText(typesOf(it)))} · ${esc(it.addr||it.region||'')} · 요청: ${who}</div>
      ${it.status==='rejected' && it.reject_reason ? `<div class="c-who" style="margin-top:6px">사유: ${esc(it.reject_reason)}</div>` : ''}
    </div>`;
}

function render() {
  const list = document.getElementById('list');
  if(!items.length) {
    list.innerHTML = `<div class="msg">${{
      pending: '확인할 추가 요청이 없어요 🎉',
      reports: '확인할 정보 제보가 없어요 🎉',
      edit: searchTerm ? '검색 결과가 없어요' : '고칠 세차장을 위에서 검색해 주세요',
      done: '아직 처리한 내역이 없어요'
    }[tab]}</div>`;
    return;
  }
  const make = { pending: cardPending, reports: cardReport, edit: cardEdit, done: cardDone }[tab];
  list.innerHTML = items.map(make).join('');
  list.querySelectorAll('.card').forEach(card => {
    const id = /^r/.test(card.dataset.id) ? card.dataset.id : +card.dataset.id;
    card.addEventListener('click', e => {
      if(e.target.closest('input,select,button,label')) return;
      if(selId === id) return;
      selId = id;
      if(tab === 'edit') render();
      else list.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c===card));
      showOnMap();
    });
    card.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => act(card, id, b.dataset.act));
  });
}

function showOnMap() {
  if(!map) return;
  if(reqMarker) reqMarker.setMap(null);
  nearMarkers.forEach(m => m.setMap(null)); nearMarkers = [];
  const it = items.find(x => x.id === selId);
  const loc = it && locOf(it);
  if(!loc || loc.lat == null) return;
  const ll = new naver.maps.LatLng(loc.lat, loc.lng);
  map.setCenter(ll); map.setZoom(17);
  reqMarker = new naver.maps.Marker({ position: ll, map, zIndex: 100,
    icon: { content: '<div style="font-size:34px;transform:translate(-50%,-100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))">📍</div>', anchor: new naver.maps.Point(0,0) } });
  nearbyOf(loc, loc.id).forEach(({p}) => nearMarkers.push(new naver.maps.Marker({ position: new naver.maps.LatLng(p.lat, p.lng), map,
    icon: { content: `<div style="transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;white-space:nowrap"><span style="width:14px;height:14px;border-radius:50%;background:#0ea5e9;border:2px solid #fff;display:inline-block"></span><span style="font-size:11px;font-weight:700;color:#fff;background:rgba(4,17,30,.9);padding:2px 6px;border-radius:6px">${esc(p.name)}</span></div>`, anchor: new naver.maps.Point(0,0) } })));
}

// 확인을 마친 제보의 가격표 사진은 바로 지움 (개인정보처리방침 약속)
async function dropPhoto(it) {
  if(!it || !it.photo) return;
  try { await PPX.db.storage.from('report-photos').remove([it.photo]); } catch(e) {}
}

function readFields(card) {
  const fields = {};
  card.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k, v = el.value.trim();
    fields[k] = v || (['tel','hours','price'].includes(k) ? null : '');
  });
  card.querySelectorAll('[data-fac]').forEach(el => { fields[el.dataset.fac] = el.value === 'null' ? null : el.value === 'true'; });
  if(card.querySelector('[data-info-fac],[data-info-in],[data-info-multi]')) {
    const it = items.find(x => x.id === selId) || {};
    const info = { ...(it.info || {}) };
    card.querySelectorAll('[data-info-fac]').forEach(el => {
      const v = el.value === 'null' ? null : el.value === 'true';
      if(v === null) delete info[el.dataset.infoFac]; else info[el.dataset.infoFac] = v;
    });
    card.querySelectorAll('[data-info-in]').forEach(el => {
      const k = el.dataset.infoIn, raw = el.value.trim();
      if(!raw) { delete info[k]; return; }
      if(k === 'height') info[k] = raw.slice(0, 10);
      else { const n = parseInt(raw.replace(/[^0-9]/g, ''), 10); if(n > 0) info[k] = n; else delete info[k]; }
    });
    ['pay','svc'].forEach(k => {
      const v = [...card.querySelectorAll(`[data-info-multi="${k}"]:checked`)].map(el => el.dataset.v);
      if(v.length) info[k] = v; else delete info[k];
    });
    fields.info = info;
  }
  if(card.querySelector('[data-type]')) {
    const checked = [...card.querySelectorAll('[data-type]:checked')].map(el => el.dataset.type);
    fields.types = [fields.type, ...checked.filter(t => t !== fields.type)];   // 대표 종류가 맨 앞
  }
  return fields;
}

async function act(card, id, what) {
  if(what === 'reject') { card.querySelector('.reject-box').classList.add('open'); card.querySelector('.reject-box input').focus(); return; }
  const btns = card.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  try {
    const it = items.find(x => x.id === id);
    if(what === 'approve') {
      const fields = readFields(card);
      if(!fields.name) { toast('이름을 입력해 주세요', true); btns.forEach(b => b.disabled = false); return; }
      await PPX.adminReview(id, 'approved', fields);
      toast('승인했어요. 이제 지도에 보여요 ✅');
    } else if(what === 'reject-send') {
      const reason = card.querySelector('.reject-box input').value.trim();
      await PPX.adminReview(id, 'rejected', { reject_reason: reason || null });
      toast('반려했어요');
    } else if(what === 'apply') {
      const sg = it.suggest || {}, fields = {};
      card.querySelectorAll('[data-s]').forEach(el => {
        if(!el.checked) return;
        const k = el.dataset.s;
        if(k === 'closed') fields.status = 'closed';
        else if(k === 'types') {
          const ts = sg.types.filter(t => typeLabel[t]);
          fields.types = ts;
          if(!ts.includes(it.place.type)) fields.type = ts[0];   // 대표 종류가 빠졌으면 첫 번째로
        }
        else if(k === 'type') { fields.type = sg.type; fields.types = [sg.type]; }   // 예전 형식 제보
        else fields[k] = sg[k];
      });
      const pick = [...card.querySelectorAll('[data-info]:checked')].map(el => el.dataset.info);
      if(pick.length) {
        const info = { ...(it.place.info || {}) };
        pick.forEach(k => { const v = sg.info[k]; if(v === null || (Array.isArray(v) && !v.length)) delete info[k]; else info[k] = v; });
        fields.info = info;
      }
      if(Object.keys(fields).length && it.place) await PPX.adminUpdate(it.place.id, fields);
      await PPX.adminResolveReport(id, 'applied');
      await dropPhoto(it);
      toast(Object.keys(fields).length ? '반영했어요. 지도에 바로 적용돼요 ✅' : '확인 처리했어요');
    } else if(what === 'dismiss') {
      await PPX.adminResolveReport(id, 'dismissed');
      await dropPhoto(it);
      toast('무시했어요');
    } else if(what === 'photo') {
      const box = card.querySelector('.photo-box');
      const url = await PPX.adminPhotoUrl(box.dataset.photo);
      box.innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="가격표 사진"></a>`;
      btns.forEach(b => b.disabled = false);
      return;
    } else if(what === 'block' || what === 'unblock') {
      if(what === 'block' && !confirm('이 사람(기기)이 앞으로 제보·요청을 못 보내게 할까요?')) { btns.forEach(b => b.disabled = false); return; }
      await PPX.adminBlock(it.reporter, what === 'block');
      toast(what === 'block' ? '막았어요. 이 사람의 새 제보는 들어오지 않아요' : '다시 받을 수 있게 했어요');
    } else if(what === 'save') {
      const fields = readFields(card);
      if(!fields.name) { toast('이름을 입력해 주세요', true); btns.forEach(b => b.disabled = false); return; }
      const saved = await PPX.adminUpdate(id, fields);
      Object.assign(it, saved);
      toast(saved.status === 'closed' ? '저장했어요. 지도에서 숨겨졌어요' : '저장했어요. 지도에 바로 적용돼요 ✅');
      btns.forEach(b => b.disabled = false);
      try { approved = await PPX.approvedPlaces(); } catch(e) {}
      render(); showOnMap();
      return;
    }
    try { approved = await PPX.approvedPlaces(); } catch(e) {}
    refreshCounts();
    load();
  } catch(e) {
    toast(PPX.koError(e), true);
    btns.forEach(b => b.disabled = false);
  }
}

init();
</script>
</body>
</html>
